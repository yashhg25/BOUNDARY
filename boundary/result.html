
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOUNDARY - Match Result</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏏 BOUNDARY</h1>
        <p>Match Result</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Match Completed!</h2>
            <p id="resultMessage">Your match summary will appear here.</p>
        </section>

        <section class="score-card">
            <h2>Final Score</h2>
            <h1 id="finalScore">--</h1>
            <p id="resultDetails">Match details will appear here.</p>
        </section>

        <section class="setup-form">
            <h2>Match Information</h2>
            <p id="resultMatchInfo"></p>

            <h2>Player of the Match</h2>
            <p id="playerOfMatch">To be announced</p>
        </section>

        <button onclick="window.location.href='scorecard.html'">
            View Scorecard
        </button>

        <button class="back-button"
                onclick="window.location.href='homepage.html'">
            Back to Home
        </button>
    </main>

    <footer><p>BOUNDARY © 2026</p></footer>
    <script src="script.js"></script>
</body>
</html>
