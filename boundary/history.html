
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOUNDARY - Match History</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏏 BOUNDARY</h1>
        <p>Match History</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Previous Matches</h2>
            <p>Explore your recorded cricket matches.</p>
        </section>

        <section class="setup-form">
            <h2>Search Matches</h2>

            <input type="text" id="matchSearch"
                   placeholder="Search by team, ground or match name"
                   oninput="displayMatchHistory()">

            <h2>All Matches</h2>

            <ul id="matchHistoryList">
                <li>No matches recorded yet.</li>
            </ul>
        </section>

        <button class="back-button"
                onclick="window.location.href='homepage.html'">
            ← Back to Home
        </button>
    </main>

    <footer><p>BOUNDARY © 2026</p></footer>
    <script src="script.js"></script>
</body>
</html>
