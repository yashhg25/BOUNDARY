
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOUNDARY - Series Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏏 BOUNDARY</h1>
        <p>Series Management</p>
    </header>

    <main>
        <section class="welcome">
            <h2>My Cricket Series</h2>
            <p>Create and manage multi-match series.</p>
        </section>

        <section class="setup-form">
            <h2>Create New Series</h2>

            <label for="seriesName">Series Name</label>
            <input type="text" id="seriesName"
                   placeholder="Example: Sunday Cricket Series">

            <label for="seriesTeamA">First Team</label>
            <input type="text" id="seriesTeamA"
                   placeholder="Enter first team">

            <label for="seriesTeamB">Second Team</label>
            <input type="text" id="seriesTeamB"
                   placeholder="Enter second team">

            <label for="plannedMatches">Planned Matches</label>
            <input type="number" id="plannedMatches"
                   min="1" placeholder="Example: 3">

            <button onclick="saveSeries()">+ Create Series</button>

            <h2>Saved Series</h2>
            <ul id="savedSeriesList">
                <li>No series created yet.</li>
            </ul>
        </section>

        <button class="back-button"
                onclick="window.location.href='homepage.html'">
            ← Back to Home
        </button>
    </main>

    <footer><p>BOUNDARY © 2026</p></footer>
    <script src="script.js"></script>
</body>
</html>
