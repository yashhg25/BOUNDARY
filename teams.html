
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOUNDARY - My Teams</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏏 BOUNDARY</h1>
        <p>My Cricket Teams</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Manage Your Teams</h2>
            <p>Create and save teams for future matches.</p>
        </section>

        <section class="setup-form">
            <h2>Create a Team</h2>

            <label for="newTeamName">Team Name</label>
            <input type="text" id="newTeamName"
                   placeholder="Enter team name">

            <button onclick="saveTeam()">+ Save Team</button>

            <h2>My Saved Teams</h2>
            <ul id="savedTeamsList">
                <li>No teams saved yet.</li>
            </ul>
        </section>

        <button class="back-button"
                onclick="window.location.href='homepage.html'">
            ← Back to Home
        </button>
    </main>

    <footer><p>BOUNDARY © 2026</p></footer>
    <script src="script.js"></script>
</body>
</html>
