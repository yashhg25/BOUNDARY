
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOUNDARY - Toss</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🏏 BOUNDARY</h1>
        <p>Toss & Match Start</p>
    </header>

    <main>
        <section class="welcome">
            <h2>Toss Result</h2>
            <p>Enter the toss details to begin your match.</p>
        </section>

        <section class="setup-form">
            <h2>Match Summary</h2>
            <p id="matchSummary"></p>

            <h2>Who Won the Toss?</h2>
            <select id="tossWinner">
                <option value="">Select Team</option>
            </select>

            <h2>What Did They Choose?</h2>
            <select id="tossDecision">
                <option value="">Select Decision</option>
                <option value="bat">Batting</option>
                <option value="bowl">Bowling</option>
            </select>

            <button onclick="startScoring()">
                Start Match →
            </button>

            <button class="back-button"
                    onclick="window.location.href='player-setup.html'">
                ← Back to Players
            </button>
        </section>
    </main>

    <footer><p>BOUNDARY © 2026</p></footer>
    <script src="script.js"></script>
</body>
</html>
